<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Minion Tower Defense</title>
  <meta name="description" content="A Bloons TD 6 style tower defense with Gru and his minions vs. the evil purple minions.">
  <style>
    @font-face { font-family: 'Luckiest Guy'; font-style: normal; font-weight: 400; font-display: swap; src: url(fonts/LuckiestGuy.woff2) format('woff2'); }

    body { touch-action: none; -webkit-user-select: none; user-select: none; }
    #game { width: 100vw; height: 100vh; }
    #boot { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      color: #ffd83a; font: 700 28px "Luckiest Guy", "Arial Black", sans-serif; letter-spacing: 1px;
      text-shadow: 0 3px 0 #2a1d14; pointer-events: none; }
  </style>
